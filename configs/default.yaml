# 기본 설정. "팀 확인 필요" 표시가 있는 값은 잠정 기본값이다.

seed: 42

paths:                      # 저장소 루트 기준 상대 경로
  raw_dir: data/foodcom
  recipes_csv: RAW_recipes.csv
  interactions_csv: RAW_interactions.csv
  processed_dir: data/processed
  figures_dir: reports/figures

preprocess:
  # implicit feedback: 평점이 이 값 이상인 상호작용을 양성으로 본다.
  positive_min_rating: 4    # 팀 확인 필요 (대안: 모든 상호작용을 양성으로 = 0)
  # 양성이 아닌 행도 산출물에 남긴다 (이미 본 레시피를 추천/negative 에서 제외하는 용도).
  keep_non_positive_rows: true
  # 양성 상호작용이 k개 미만인 사용자·레시피를 반복 제거한다.
  k_core: 5                 # 팀 확인 필요 (근거: docs/eda.md 4절)
  # 칼로리 이상치: 레시피 전체에서 이 분위수를 넘는 레시피를 제거한다. null 이면 적용하지 않는다.
  # 근거는 docs/eda.md 5절. 꼬리의 값은 레시피 전체 분량 합계로 보이는 것들이다.
  calorie_max_quantile: 0.999   # 팀 확인 필요
  remove_zero_calories: true
  # RAW_recipes.csv 의 nutrition 리스트 순서 (Kaggle 데이터 카드의 컬럼 설명, 2026-11-11 확인).
  # 원출처 표기: calories (#), 나머지 6개는 PDV (percent daily value).
  nutrition_fields: [calories, total_fat, sugar, sodium, protein, saturated_fat, carbohydrates]

split:
  method: per_user_leave_last_out   # 팀 확인 필요 (대안: global_time)
  n_test: 1                 # 사용자별 마지막 양성 n개
  n_valid: 1                # 그 앞의 양성 n개
  # 날짜가 일 단위라 같은 날 기록이 여러 개일 수 있다. 동률은 원본 파일의 행 순서로 정한다.
  # cold user/item 을 다루지 않으므로 평가 집합에는 train 에 등장한 사용자·레시피만 남긴다.
  restrict_eval_to_train: true

# 아래 두 블록은 자리만 잡아 둔 값이다. 6~8단계에서 실험으로 확정한다.
minhash:
  num_perm: 128
  stop_ingredients: []      # salt 같은 고빈도 재료 처리. 6단계에서 결정
  max_doc_freq: null

lsh:
  bands: 32
  rows: 4                   # bands * rows == minhash.num_perm
  query_profile: all_train_positives   # 대안: recent_n
  recent_n: null
