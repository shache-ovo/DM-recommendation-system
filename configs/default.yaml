# 기본 설정. "팀 확인 필요" 표시가 있는 값은 잠정 기본값이다.

seed: 42

paths:                      # 저장소 루트 기준 상대 경로
  raw_dir: data/foodcom
  recipes_csv: RAW_recipes.csv
  interactions_csv: RAW_interactions.csv
  processed_dir: data/processed
  figures_dir: reports/figures

preprocess:
  # implicit feedback: 평점이 이 값 이상인 상호작용을 양성으로 본다.
  positive_min_rating: 4    # 팀 확인 필요 (대안: 모든 상호작용을 양성으로 = 0)
  # 양성이 아닌 행도 산출물에 남긴다 (이미 본 레시피를 추천/negative 에서 제외하는 용도).
  keep_non_positive_rows: true
  # 양성 상호작용이 k개 미만인 사용자·레시피를 반복 제거한다.
  k_core: 5                 # 팀 확인 필요 (근거: docs/eda.md 4절)
  # 칼로리 이상치: 레시피 전체에서 이 분위수를 넘는 레시피를 제거한다. null 이면 적용하지 않는다.
  # 근거는 docs/eda.md 5절. 꼬리의 값은 레시피 전체 분량 합계로 보이는 것들이다.
  calorie_max_quantile: 0.999   # 팀 확인 필요
  remove_zero_calories: true
  # RAW_recipes.csv 의 nutrition 리스트 순서 (Kaggle 데이터 카드의 컬럼 설명, 2026-11-11 확인).
  # 원출처 표기: calories (#), 나머지 6개는 PDV (percent daily value).
  nutrition_fields: [calories, total_fat, sugar, sodium, protein, saturated_fat, carbohydrates]

split:
  method: per_user_leave_last_out   # 팀 확인 필요 (대안: global_time)
  n_test: 1                 # 사용자별 마지막 양성 n개
  n_valid: 1                # 그 앞의 양성 n개
  # 날짜가 일 단위라 같은 날 기록이 여러 개일 수 있다. 동률은 원본 파일의 행 순서로 정한다.
  # cold user/item 을 다루지 않으므로 평가 집합에는 train 에 등장한 사용자·레시피만 남긴다.
  restrict_eval_to_train: true

# 재료 집합 정규화 (MinHash 입력). 근거는 docs/minhash.md
ingredients:
  # 이름 끝의 s / es / ies 를 떼거나 바꾼 형태가 어휘에 있을 때만 그 형태로 바꾼다 (eggs -> egg)
  fold_plurals: true
  # 같은 재료를 가리키는 이름을 대표 이름으로 바꾼다. 값이 리스트면 여러 재료로 나눈다.
  # 빈도 상위 130개 이름 중 뜻이 분명히 같은 것만 넣었다. 복수형을 접은 뒤에 적용한다.
  aliases:
    garlic clove: garlic
    all-purpose flour: flour
    extra virgin olive oil: olive oil
    black pepper: pepper
    ground black pepper: pepper
    fresh ground black pepper: pepper
    fresh ground pepper: pepper
    kosher salt: salt
    sea salt: salt
    granulated sugar: sugar
    white sugar: sugar
    unsalted butter: butter
    vanilla extract: vanilla
    ground cinnamon: cinnamon
    ground cumin: cumin
    ground nutmeg: nutmeg
    confectioners' sugar: powdered sugar
    fresh lemon juice: lemon juice
    salt and pepper: [salt, pepper]
    salt & freshly ground black pepper: [salt, pepper]
  # 정규화 뒤 전체 레시피 중 이 비율 이상에 나오는 재료를 집합에서 뺀다. null 이면 빼지 않는다.
  max_doc_freq: null        # 6단계 실험으로 정한다

minhash:
  num_perm: 128             # 시그니처 길이. 6단계 실험으로 정한다

lsh:
  # 시그니처의 앞 bands * rows 개 값을 rows 개씩 bands 개로 나눈다. bands * rows <= minhash.num_perm
  # 후보가 될 확률이 가파르게 오르는 유사도는 대략 (1/bands)^(1/rows) = 0.29 다.
  bands: 42                 # 근거: docs/lsh_eval.md
  rows: 3                   # 근거: docs/lsh_eval.md
  index_scope: core         # core: 추천 대상 레시피만 인덱스에 넣는다. all: 전체 레시피
  # 후보의 순위를 매기는 값. exact: 재료 집합으로 계산한 정확한 Jaccard. estimate: MinHash 추정값
  rank_by: exact
  # lsh_neighbors.csv 에 레시피마다 저장할 이웃 수와 최소 Jaccard
  neighbors_top_n: 20
  neighbors_min_jaccard: 0.0
